version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
  - package-ecosystem: docker
    directories:
      - "/*/src/test/resources/*"
    schedule:
      interval: "weekly"
