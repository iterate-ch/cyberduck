name: Publish Snapshot
on:
  # Nightly, built only when master changed since the last successful run (see the check job)
  schedule:
    - cron: '0 1 * * *'
  # Always builds
  workflow_dispatch:
# Queue instead of running in parallel
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  # A scheduled run builds only if master moved since the last successful run of this workflow. A failed run is
  # therefore retried the next night.
  check:
    permissions:
      actions: read
    runs-on: [ linux, x64 ]
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Compare with last successful run
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          changed=true
          if [ "$EVENT" = "schedule" ]; then
            if last=$(gh run list --workflow snapshot.yml --branch master --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""'); then
              if [ "$last" = "$GITHUB_SHA" ]; then
                changed=false
                echo "No change on master since the last successful run ($GITHUB_SHA)"
              fi
            else
              echo "::warning::Could not read the last successful run, building"
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64, goal: deploy }
          - { os: windows, arch: x64, goal: deploy }
          - { os: linux, arch: x64, goal: deploy }
          - { os: linux, arch: arm64, goal: deploy, runner: ubuntu-26.04-arm }
    permissions:
      checks: write
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/deploy.yml
    with:
      SPARKLE_FEED: nightly
      RUNNER_OS: ${{ matrix.os }}
      RUNNER_ARCH: ${{ matrix.arch }}
      RUNNER: ${{ matrix.runner }}
      MAVEN_GOAL: ${{ matrix.goal }}
      DEVELOPER_DIR: '/Applications/Xcode 26.app/Contents/Developer'
      SIGNTOOL_CSP: 'Google Cloud KMS Provider'
      SIGNTOOL_KC: 'projects/api-project-996125414232/locations/europe/keyRings/code-signing/cryptoKeys/windows/cryptoKeyVersions/1'
      CODESIGN_CERTIFICATE: 'Developer ID Application: David Kocher (G69SCX94XU)'
      INSTALLER_CERTIFICATE: 'Developer ID Installer: David Kocher (G69SCX94XU)'
      CODESIGN_PROVISIONPROFILE_NAME: 'default.provisionprofile'
      CODESIGN_ENTITLEMENTS_NAME: 'default.entitlements'
    secrets: inherit

  publish:
    needs: [ check, deploy ]
    if: ${{ !cancelled() && needs.check.outputs.changed == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      SPARKLE_FEED: nightly
    secrets: inherit

  # Update the Homebrew tap at github.com/iterate-ch/homebrew-cyberduck. Nightly
  # only, so it lives here rather than in the shared publish.yml.
  brew:
    needs: [ check, publish ]
    if: ${{ !cancelled() && needs.check.outputs.changed == 'true' }}
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v7
        with:
          repository: iterate-ch/homebrew-cyberduck
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cyberduck

      - name: Download Formula
        uses: actions/download-artifact@v8
        with:
          pattern: duck.rb
          path: homebrew-cyberduck
          merge-multiple: true

      - name: Commit Formula
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: homebrew-cyberduck
          branch: master
          commit_message: Update version
          commit_author: cyberduck
          commit_user_name: iterate GmbH
          commit_user_email: noreply@cyberduck.io
          file_pattern: duck.rb
