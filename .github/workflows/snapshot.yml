name: Publish Snapshot
on:
  push:
    branches:
      - master
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos, windows, linux, linux-arm64 ]
    uses: ./.github/workflows/deploy.yml
    with:
      sparkle-feed: nightly
      platform: ${{ matrix['platform'] }}
    secrets: inherit
