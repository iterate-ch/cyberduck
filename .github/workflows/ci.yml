name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  build:
    permissions:
      checks: write
      statuses: write
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ linux-self-hosted ]
        protocol:
          - irods
          - spectra
          - s3
          - smb
          - googlestorage
          - openstack
          - webdav
          - azure
          - ssh
          - ftp
          - googledrive
          - backblaze
          - dropbox
          - nio
          - hubic
          - onedrive
          - dracoon
          - storegate
          - brick
          - nextcloud
          - owncloud
          - manta
          - box
          - ctera
          - eue
          - freenet
          - deepbox
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Build dependencies
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        run: mvn install -pl ${{ matrix.protocol }} -am -DskipTests --no-transfer-progress --batch-mode -D"enforcer.skip"
      - name: Test ${{ matrix.protocol }}
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          SKIP_SIGN: true
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        run: mvn verify -pl ${{ matrix.protocol }} --no-transfer-progress --batch-mode --fail-at-end -D"enforcer.skip"
      - name: Publish Test Report
        if: ${{ always() }}
        uses: ScalableCapital/action-surefire-report@v2
        with:
          report_mode: check-run
          check_name: Test Report (${{ matrix.protocol }})
