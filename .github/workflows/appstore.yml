name: Publish App Store
on:
  push:
    tags: [ '*' ]
jobs:
  appstore:
    permissions:
      checks: write
      contents: read
      packages: read
    runs-on: macos-self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Import Developer ID certificate
        uses: ./.github/actions/import-developer-id-certificate
        with:
          certificate: ${{ secrets.CODESIGN_MACOS_CERTIFICATES_BASE64 }}
          certificate-password: ${{ secrets.CODESIGN_MACOS_CERTIFICATES_PASSWORD }}
      - name: Build with Maven
        run: mvn --settings .github/maven-settings.xml --batch-mode deploy -DskipTests -DskipITs -P!local,appstore,sandbox
        env:
          MAVEN_CYBERDUCK_USERNAME: ${{ secrets.MAVEN_CYBERDUCK_USERNAME }}
          MAVEN_CYBERDUCK_PASSWORD: ${{ secrets.MAVEN_CYBERDUCK_PASSWORD }}
          DEVELOPER_DIR: /Applications/Xcode 15.app/Contents/Developer
          NOTARIZATION_USER: ${{ secrets.NOTARIZATION_USER }}
          NOTARIZATION_PW: ${{ secrets.NOTARIZATION_PW }}
          NOTARIZATION_TEAMID: ${{ secrets.NOTARIZATION_TEAMID }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
      - name: Upload to App Store
        env:
          NOTARIZATION_USER: ${{ secrets.NOTARIZATION_USER }}
          NOTARIZATION_PW: ${{ secrets.NOTARIZATION_PW }}
        run: xcrun altool --verbose --upload-app -f osx/target/release/*.pkg -t osx -u "$NOTARIZATION_USER" -p "$NOTARIZATION_PW"
