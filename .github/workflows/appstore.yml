name: Publish Mac App Store
on:
  push:
    tags: [ '*' ]
  # Called by prepare.yml, whose pushes do not trigger tag workflows
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, e.g. release-9-6-0'
        required: true
        type: string
# Queue instead of running in parallel. Fixed name because github.workflow is the
# caller's name when called from prepare.yml, which would collide with its group.
concurrency:
  group: appstore
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      checks: write
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/deploy.yml
    with:
      REF: ${{ inputs.tag || github.ref_name }}
      MAVEN_PROFILES: 'appstore'
      # App Store artifacts are already published by the release/snapshot macOS leg;
      # this run only needs to build the sandboxed .pkg for upload.
      MAVEN_GOAL: install
      RUNNER_OS: macos
      RUNNER_ARCH: arm64
      DEVELOPER_DIR: '/Applications/Xcode 26.app/Contents/Developer'
      CODESIGN_CERTIFICATE: 'Apple Distribution: David Kocher (G69SCX94XU)'
      INSTALLER_CERTIFICATE: '3rd Party Mac Developer Installer: David Kocher (G69SCX94XU)'
      CODESIGN_PROVISIONPROFILE_NAME: 'appstore.provisionprofile'
      CODESIGN_ENTITLEMENTS_NAME: 'sandbox.entitlements'
      SKIP_NOTARIZE: true
      XCODE_CONFIGURATION: 'Mac App Store'
    secrets: inherit

  appstore:
    needs: deploy
    permissions:
      actions: read
      contents: read
    runs-on: macos
    steps:
      - name: Clean
        run: rm -rf release
        shell: bash
      - name: Download App PKG (macOS)
        uses: actions/download-artifact@v8
        with:
          pattern: Cyberduck-*.pkg
          path: release
          merge-multiple: true
      - name: Upload to Mac App Store
        env:
          NOTARIZATION_USER: ${{ secrets.NOTARIZATION_USER }}
          NOTARIZATION_PW: ${{ secrets.NOTARIZATION_PW }}
        run: xcrun altool --verbose --upload-app -f release/Cyberduck-*.pkg -t osx -u "$NOTARIZATION_USER" -p "$NOTARIZATION_PW"
