name: Publish Release
on:
  push:
    tags: [ '*' ]
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64, goal: deploy }
          - { os: windows, arch: x64, goal: deploy }
          - { os: linux, arch: x64, goal: deploy }
          - { os: linux, arch: arm64, goal: deploy }
    uses: ./.github/workflows/deploy.yml
    with:
      SPARKLE_FEED: release
      RUNNER_OS: ${{ matrix.os }}
      RUNNER_ARCH: ${{ matrix.arch }}
      MAVEN_GOAL: ${{ matrix.goal }}
      DEVELOPER_DIR: '/Applications/Xcode 26.app/Contents/Developer'
      SIGNTOOL_CSP: 'Google Cloud KMS Provider'
      SIGNTOOL_KC: 'projects/api-project-996125414232/locations/europe/keyRings/code-signing/cryptoKeys/windows/cryptoKeyVersions/1'
      CODESIGN_CERTIFICATE: 'Developer ID Application: David Kocher (G69SCX94XU)'
      INSTALLER_CERTIFICATE: 'Developer ID Installer: David Kocher (G69SCX94XU)'
      CODESIGN_PROVISIONPROFILE_NAME: 'default.provisionprofile'
      CODESIGN_ENTITLEMENTS_NAME: 'default.entitlements'
    secrets: inherit

  # Source tarball referenced by the homebrew-core `duck` formula, which builds from
  # https://dist.duck.sh/duck-src-<version>.<revision>.tar.gz. Archives tracked files
  # only. Uploaded as a `duck-*` artifact so the `cli`, `sftp` and `release` jobs
  # pick it up.
  source:
    permissions:
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - uses: actions/checkout@v7
        with:
          # The revision is the commit count at the tag
          fetch-depth: 0

      - name: Archive Source
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#release-}
          version=${version//-/.}
          revision=$(git rev-list --count HEAD)
          name="duck-src-${version}.${revision}"
          git archive --format=tar --prefix="${name}/" HEAD | gzip -9n > "${name}.tar.gz"
          sha256sum "${name}.tar.gz"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: duck-src-*.tar.gz
          archive: false

  publish:
    needs: [ deploy, source ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/publish.yml
    with:
      SPARKLE_FEED: release
    secrets: inherit

  # Mirror the CLI installers to the dist.duck.sh SFTP host. Release only, so it
  # lives here rather than in the shared publish.yml.
  sftp:
    needs: [ deploy, source ]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Download CLI
        uses: actions/download-artifact@v8
        with:
          pattern: '{duck-*,duck_*}'
          path: release
          merge-multiple: true

      - name: Credentials
        id: identity
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: SFTP Upload
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://dist.duck.sh/var/data/dist.duck.sh/
          path: release/duck-*
          args: '--existing overwrite --verbose'

  # Publish a GitHub Release for the pushed tag with the installer artifacts
  # attached. Runs independently of `publish` so a delivery-channel failure
  # never blocks the release, and vice versa.
  release:
    needs: [ deploy, source ]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: [ linux, x64 ]
    steps:
      - name: Determine Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#release-}
          echo "version=${version//-/.}" >> "$GITHUB_OUTPUT"

      - name: Download App
        uses: actions/download-artifact@v8
        with:
          pattern: Cyberduck-*
          path: release
          merge-multiple: true

      - name: Download CLI
        uses: actions/download-artifact@v8
        with:
          pattern: '{duck-*,duck_*}'
          path: release
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cyberduck ${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Attach whatever built; a failed matrix leg must not fail the release.
          fail_on_unmatched_files: false
          files: |
            release/Cyberduck-*.zip
            release/Cyberduck-*.pkg
            release/Cyberduck-*.exe
            release/Cyberduck-*.msi
            release/Cyberduck-*.appx
            release/duck-*.pkg
            release/duck-*.exe
            release/duck-*.msi
            release/duck_*.deb
            release/duck-*.rpm
            release/duck-*.tar.gz

  # Push to the Chocolatey community repository. Release only, so it lives here
  # rather than in the shared publish.yml.
  chocolatey:
    needs: deploy
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    runs-on: [ self-hosted, windows, x64 ]
    steps:
      - name: Download NUPKG
        uses: actions/download-artifact@v8
        with:
          pattern: '*.nupkg'
          path: release
          merge-multiple: true

      - name: Chocolatey Push (Windows)
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          Get-ChildItem "release\cyberduck.*.nupkg" | ForEach-Object {
            choco push $_.FullName --api-key $env:CHOCOLATEY_API_KEY --verbose
          }

      - name: Chocolatey Push (Windows CLI)
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          Get-ChildItem "release\duck.*.nupkg" | ForEach-Object {
            choco push $_.FullName --api-key $env:CHOCOLATEY_API_KEY --verbose
          }
