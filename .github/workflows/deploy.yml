name: Publish Artifacts
on:
  workflow_dispatch:
  push:
    tags: [ '*' ]
    branches:
      - master
jobs:
  snapshot:
    permissions:
      checks: write
      contents: read
      packages: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-self-hosted, linux-self-hosted, linux-arm64-self-hosted, windows-self-hosted ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Add msbuild to PATH
        if: runner.os == 'windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: "NuGet"
        if: runner.os == 'windows'
        env:
          NugetCredentials: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "NuGetPackageSourceCredentials_gh-ikvmnet=${{ env.NugetCredentials }}" >> $env:GITHUB_ENV
          echo "NuGetPackageSourceCredentials_gh-iterate-ch=${{ env.NugetCredentials }}" >> $env:GITHUB_ENV
      - name: Copy Sparkle Updater Private Key (DSA)
        shell: bash
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY_DSA" > www/update/private.pem
        env:
          SPARKLE_PRIVATE_KEY_DSA: ${{ secrets.SPARKLE_PRIVATE_KEY_DSA }}
      - name: Copy Sparkle Updater Private Key (ED25519)
        shell: bash
        run: echo "${{ env.SPARKLE_PRIVATE_KEY_ED25519 }}" > www/update/private-ed25519.pem
        env:
          SPARKLE_PRIVATE_KEY_ED25519: ${{ secrets.SPARKLE_PRIVATE_KEY_ED25519 }}
      - name: Import Developer ID certificate
        uses: ./.github/actions/import-developer-id-certificate
        with:
          certificate: ${{ secrets.CODESIGN_MACOS_CERTIFICATES_BASE64 }}
          certificate-password: ${{ secrets.CODESIGN_MACOS_CERTIFICATES_PASSWORD }}
      - name: Build with Maven
        run: mvn --settings .github/maven-settings.xml --batch-mode deploy -DskipTests -DskipITs -D"sparkle.feed=${{ github.ref_type == 'branch' && 'nightly' || '' }}" -P!local
        env:
          MAVEN_CYBERDUCK_USERNAME: ${{ secrets.MAVEN_CYBERDUCK_USERNAME }}
          MAVEN_CYBERDUCK_PASSWORD: ${{ secrets.MAVEN_CYBERDUCK_PASSWORD }}
          DEVELOPER_DIR: /Applications/Xcode 15.app/Contents/Developer
          NOTARIZATION_USER: ${{ secrets.NOTARIZATION_USER }}
          NOTARIZATION_PW: ${{ secrets.NOTARIZATION_PW }}
          NOTARIZATION_TEAMID: ${{ secrets.NOTARIZATION_TEAMID }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          SIGNTOOL_CSP: ${{ secrets.SIGNTOOL_CSP }}
          SIGNTOOL_KC: ${{ secrets.SIGNTOOL_KC }}

      - name: Archive App ZIP (macOS)
        if: runner.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            osx/target/release/*.zip
      - name: Archive App PKG (macOS)
        if: runner.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            osx/target/release/*.pkg
      - name: Archive Update Feed (macOS)
        if: runner.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: cyberduck-macos-changelog
          archive: false
          path: |-
            osx/target/update/changelog.*
      - name: Archive CLI PKG (macOS)
        if: runner.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/osx/target/release/*.pkg
      - name: Archive CLI Formula (macOS)
        if: runner.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/osx/target/release/*.rb

      - name: Archive EXE (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            windows/target/release/*.exe
      - name: Archive MSI (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            windows/target/release/*.msi
      - name: Archive APPX (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            windows/target/release/*.appx
      - name: Archive Update Feed (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: cyberduck-windows-changelog
          archive: false
          path: |-
            windows/target/update/changelog.*
      - name: Archive CLI EXE (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/windows/target/release/*.exe
      - name: Archive CLI MSI (Windows)
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/windows/target/release/*.msi

      - name: Archive DEB (Linux)
        if: runner.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/linux/target/release/*.deb
      - name: Archive RPM (Linux)
        if: runner.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |-
            cli/linux/target/release/*.rpm

  publish:
    needs: snapshot
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    runs-on: linux-self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: [ macos, windows, linux ]
    steps:
      - name: Download App ZIP (macOS)
        if: matrix.target == 'macos'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: Cyberduck-*.zip
          path: release
          merge-multiple: true
      - name: Download App PKG (macOS)
        if: matrix.target == 'macos'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: Cyberduck-*.pkg
          path: release
          merge-multiple: true
      - name: Download CLI PKG (macOS)
        if: matrix.target == 'macos'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: duck[-_]*.pkg
          path: release
          merge-multiple: true
      - name: Download CLI Formula (macOS)
        if: matrix.target == 'macos'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: '*.rb'
          path: release
          merge-multiple: true
      - name: Download EXE (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: Cyberduck-Installer-*.exe
          path: release
          merge-multiple: true
      - name: Download MSI (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: Cyberduck-Installer-*.msi
          path: release
          merge-multiple: true
      - name: Download APPX (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: '*.appx'
          path: release
          merge-multiple: true
      - name: Download CLI (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: duck[-_]*
          path: release
          merge-multiple: true
      - name: Download DEB (Linux)
        if: matrix.target == 'linux'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: duck[-_]*.deb
          path: release
          merge-multiple: true
      - name: Download RPM (Linux)
        if: matrix.target == 'linux'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: duck[-_]*.rpm
          path: release
          merge-multiple: true
      - name: Download Update Feed
        if: matrix.target != 'linux'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: cyberduck-${{ matrix.target }}-changelog
          path: update
          merge-multiple: true

      - name: Check Artifacts
        id: check
        shell: bash
        run: |
          if compgen -G "release/*" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ${{ matrix.target }} artifacts found, skipping publish for this target."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Credentials
        id: identity
        if: steps.check.outputs.found == 'true'
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: S3 Upload
        if: matrix.target != 'linux' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: ${{secrets.AWS_ACCESS_KEY_ID}}
          PASSWORD: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        with:
          mode: upload
          url: ${{ github.ref_type == 'branch' && 's3:/snapshots.cyberduck.io/' || 's3:/release.cyberduck.io/' }}
          path: release/Cyberduck-*
          args: '--verbose --existing overwrite --region us-east-1'

      - name: Rackspace Upload
        if: matrix.target != 'linux' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: ${{secrets.RACKSPACE_USER}}
          PASSWORD: ${{secrets.RACKSPACE_PASSWORD}}
        with:
          mode: upload
          url: ${{ github.ref_type == 'branch' && 'rackspace:/snapshots.cyberduck.io/' || 'rackspace:/cdn.cyberduck.ch/' }}
          path: release/Cyberduck-*
          args: '--verbose --existing overwrite --region DFW'

      - name: Rackspace Upload (macOS CLI)
        if: matrix.target == 'macos' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: ${{secrets.RACKSPACE_USER}}
          PASSWORD: ${{secrets.RACKSPACE_PASSWORD}}
        with:
          mode: upload
          url: rackspace:/cdn.duck.sh/
          path: release/duck[-_]*
          args: '--verbose --existing overwrite --region IAD'

      - name: Rackspace Upload (Windows CLI)
        if: matrix.target == 'windows' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: ${{secrets.RACKSPACE_USER}}
          PASSWORD: ${{secrets.RACKSPACE_PASSWORD}}
        with:
          mode: upload
          url: rackspace:/cdn.duck.sh/
          path: release/duck[-_]*
          args: '--verbose --existing overwrite --region IAD'

      - name: Rackspace Upload (Linux)
        if: matrix.target == 'linux' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: ${{secrets.RACKSPACE_USER}}
          PASSWORD: ${{secrets.RACKSPACE_PASSWORD}}
        with:
          mode: upload
          url: rackspace:/cdn.duck.sh/
          path: release/duck[-_]*
          args: '--verbose --existing overwrite --region IAD'

      - name: SFTP Upload (App)
        if: github.ref_type == 'branch' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://dist.duck.sh/
          path: release/Cyberduck-*
          args: '--existing overwrite --verbose'

      - name: SFTP Upload (CLI)
        if: steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://dist.duck.sh/
          path: release/duck[-_]*
          args: '--existing overwrite --verbose'

      - name: SFTP Upload (macOS CLI Formula)
        if: matrix.target == 'macos' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://version.cyberduck.io/
          path: release/*.rb
          args: '--existing overwrite --verbose'

      - name: Upload Feed
        if: matrix.target != 'linux' && steps.check.outputs.found == 'true'
        uses: iterate-ch/cyberduck-cli-action@v1
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: ${{ matrix.target == 'macos' && (github.ref_type == 'branch' && 'sftp://version.cyberduck.io/nightly/' || 'sftp://version.cyberduck.io/') || (github.ref_type == 'branch' && 'sftp://version.cyberduck.io/windows/nightly/' || 'sftp://version.cyberduck.io/windows/') }}
          path: update/changelog.*
          args: '--existing overwrite --verbose'