name: Publish Artifacts

on:
  workflow_call:
    inputs:
      SPARKLE_FEED:
        required: true
        type: string

jobs:
  app:
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Download App
        uses: actions/download-artifact@v8
        with:
          pattern: Cyberduck-*
          path: release
          merge-multiple: true

      - name: Credentials
        id: identity
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: S3 Upload
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: ${{ secrets.AWS_ACCESS_KEY_ID }}
          PASSWORD: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          mode: upload
          url: ${{ inputs['SPARKLE_FEED'] == 'nightly' && 's3:/snapshots.cyberduck.io/' || inputs['SPARKLE_FEED'] == 'beta' && 's3:/beta.cyberduck.io/' || 's3:/release.cyberduck.io/' }}
          path: release/Cyberduck-*
          args: '--verbose --existing overwrite --region us-east-1'

      - name: Rackspace Upload
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: ${{ secrets.RACKSPACE_USER }}
          PASSWORD: ${{ secrets.RACKSPACE_PASSWORD }}
        with:
          mode: upload
          url: ${{ inputs['SPARKLE_FEED'] == 'nightly' && 'rackspace:/snapshots.cyberduck.io/' || inputs['SPARKLE_FEED'] == 'beta' && 'rackspace:/beta.cyberduck.io/' || 'rackspace:/cdn.cyberduck.ch/' }}
          path: release/Cyberduck-*
          args: '--verbose --existing overwrite --region DFW'

      - name: SFTP Upload
        if: ${{ inputs['SPARKLE_FEED'] == 'nightly' }}
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://update.cyberduck.io/nightly/
          path: release/Cyberduck-*
          args: '--existing overwrite --verbose'

  cli:
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Download CLI
        uses: actions/download-artifact@v8
        with:
          pattern: '{duck-*.pkg,duck-*.exe,duck-*.msi}'
          path: release
          merge-multiple: true

      - name: Credentials
        id: identity
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: Rackspace Upload
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: ${{ secrets.RACKSPACE_USER }}
          PASSWORD: ${{ secrets.RACKSPACE_PASSWORD }}
        with:
          mode: upload
          url: ${{ inputs['SPARKLE_FEED'] == 'nightly' && 'rackspace:/cdn.duck.sh/nightly/' || inputs['SPARKLE_FEED'] == 'beta' && 'rackspace:/cdn.duck.sh/nightly/' || 'rackspace:/cdn.duck.sh/' }}
          path: release/duck-*
          args: '--verbose --existing overwrite --region IAD'

      - name: SFTP Upload
        if: ${{ inputs['SPARKLE_FEED'] == 'release' }}
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://dist.duck.sh/
          path: release/duck-*
          args: '--existing overwrite --verbose'

  changelog:
    # Publish the appcast only after the app archives it points at are live.
    needs: app
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Download Update Feed
        uses: actions/download-artifact@v8
        with:
          pattern: changelog-*
          path: update

      - name: Credentials
        id: identity
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: Upload Feed (macOS)
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: ${{ format('sftp://version.cyberduck.io/macos/{0}', inputs['SPARKLE_FEED']) }}
          path: update/changelog-macOS/changelog.*
          args: '--existing overwrite --verbose'

      - name: Upload Feed (Windows)
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.SFTP_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: ${{ format('sftp://version.cyberduck.io/windows/{0}', inputs['SPARKLE_FEED']) }}
          path: update/changelog-Windows/changelog.*
          args: '--existing overwrite --verbose'

  deb:
    needs: cli
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Download DEB
        uses: actions/download-artifact@v8
        with:
          pattern: '*.deb'
          path: release
          merge-multiple: true

      - name: Import GPG Signing Key
        env:
          DEB_GPG_PRIVATE_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          umask 077
          GNUPGHOME="${{ runner.temp }}/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$DEB_GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Install deb-s3
        run: |
          sudo dnf install -y ruby rubygems
          sudo gem install deb-s3 --no-document
        shell: bash

      # Builds land in the 'nightly' codename, releases in 'stable'.
      - name: Debian Package Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.deb)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::warning::No .deb packages found in release/; skipping deb-s3 upload"
            exit 0
          fi
          deb-s3 upload \
            --bucket repo.deb.cyberduck.io \
            --codename ${{ inputs['SPARKLE_FEED'] == 'release' && 'stable' || 'nightly' }} \
            --s3-region us-east-1 \
            --sign 3FEFBE72 \
            --gpg-options "--no-tty" \
            "${packages[@]}"

  rpm:
    needs: cli
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    # RPM/YUM repository on repo.cyberduck.io. Builds land in the 'nightly' tree, releases in 'stable'.
    env:
      CODENAME: ${{ inputs['SPARKLE_FEED'] == 'release' && 'stable' || 'nightly' }}
    steps:
      - name: Download RPM
        uses: actions/download-artifact@v8
        with:
          pattern: '*.rpm'
          path: release
          merge-multiple: true

      - name: Credentials
        id: identity
        env:
          SFTP_IDENTITY: ${{ secrets.SFTP_IDENTITY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SFTP_IDENTITY" > private-key.pem
          echo "KEYFILE=private-key.pem" >> "$GITHUB_OUTPUT"

      - name: SFTP Upload (aarch64)
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.RPM_REPO_SSH_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://repo.cyberduck.io/data/repo.cyberduck.io/${{ env.CODENAME }}/aarch64/
          path: release/duck-*.aarch64.rpm
          args: '--existing overwrite --verbose'

      - name: SFTP Upload (x86_64)
        uses: iterate-ch/cyberduck-cli-action@v2
        env:
          USERNAME: '${{ secrets.RPM_REPO_SSH_USER }}'
          IDENTITY: '${{ steps.identity.outputs.KEYFILE }}'
        with:
          mode: upload
          url: sftp://repo.cyberduck.io/data/repo.cyberduck.io/${{ env.CODENAME }}/x86_64/
          path: release/duck-*.x86_64.rpm
          args: '--existing overwrite --verbose'

      - name: Rebuild Repository Metadata
        env:
          RPM_REPO_SSH_USER: ${{ secrets.RPM_REPO_SSH_USER }}
          KEYFILE: ${{ steps.identity.outputs.KEYFILE }}
        shell: bash
        run: |
          host="$RPM_REPO_SSH_USER@repo.cyberduck.io"
          for arch in aarch64 x86_64; do
            remote="/data/repo.cyberduck.io/$CODENAME/$arch"
            echo "Rebuilding repository metadata for $host:$remote"
            ssh -F /dev/null -i "$KEYFILE" -o BatchMode=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$host" "/usr/bin/createrepo --update '$remote'"
          done

  brew:
    needs: cli
    # Maintain the Homebrew tap at github.com/iterate-ch/homebrew-cyberduck
    if: ${{ inputs['SPARKLE_FEED'] == 'nightly' }}
    permissions:
      actions: read
      contents: read
    runs-on: [ linux, x64 ]
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v7
        with:
          repository: iterate-ch/homebrew-cyberduck
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cyberduck

      - name: Download Formula
        uses: actions/download-artifact@v8
        with:
          pattern: duck.rb
          path: homebrew-cyberduck
          merge-multiple: true

      - name: Commit Formula
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          repository: homebrew-cyberduck
          branch: master
          commit_message: Update version
          commit_user_name: iterate GmbH
          commit_user_email: noreply@cyberduck.io
          file_pattern: duck.rb
