name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name, e.g. release-9-6-0'
        required: true
        type: string
      releaseVersion:
        description: 'Release version, e.g. 9.6.0'
        required: true
        type: string
      developmentVersion:
        description: 'Next development version, e.g. 9.6.1-SNAPSHOT'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Equivalent of the former Jenkins `release:prepare` job. Commits the release
  # version, tags it and commits the next development version, then pushes. Pushes
  # made with GITHUB_TOKEN do not trigger tag workflows, so release.yml,
  # appstore.yml and image.yml are dispatched explicitly below.
  prepare:
    permissions:
      contents: write
    runs-on: [ linux, x64 ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Release
        shell: bash
        run: >
          mvn release:prepare
          -DreleaseVersion="${{ inputs.releaseVersion }}"
          -DdevelopmentVersion="${{ inputs.developmentVersion }}"
          -Dtag="${{ inputs.tag }}"
          -DpushChanges=false
          --no-transfer-progress --batch-mode --errors -DskipTests

      - name: Push
        shell: bash
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/${{ inputs.tag }}"

  # Dispatch each build as its own run on the tag, as a tag push would. Separate runs
  # keep their artifacts apart, so the Mac App Store build cannot collide with the
  # release build.
  dispatch:
    needs: prepare
    permissions:
      actions: write
    runs-on: [ linux, x64 ]
    steps:
      - name: Dispatch Builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh workflow run release.yml --ref "${{ inputs.tag }}"
          gh workflow run appstore.yml --ref "${{ inputs.tag }}"
          gh workflow run image.yml --ref "${{ inputs.tag }}" -f tag="${{ inputs.tag }}"
