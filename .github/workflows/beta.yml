name: Publish Beta
on:
  workflow_dispatch:
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos, windows, linux, linux-arm64 ]
    uses: ./.github/workflows/deploy.yml
    with:
      SPARKLE_FEED: beta
      PLATFORM: ${{ matrix['platform'] }}
      DEVELOPER_DIR: '/Applications/Xcode 26.app/Contents/Developer'
      SIGNTOOL_CSP: 'Google Cloud KMS Provider'
      SIGNTOOL_KC: 'projects/api-project-996125414232/locations/europe/keyRings/code-signing/cryptoKeys/windows/cryptoKeyVersions/1'
    secrets: inherit

  publish:
    needs: deploy
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/publish.yml
    with:
      SPARKLE_FEED: beta
    secrets: inherit
