name: Deploy Maven Artifacts

# Deploys the Maven artifacts to the maven.cyberduck.io repository from any branch.
# SNAPSHOT versions go to the snapshot repository, others to releases. Each
# platform deploys the dependency closure it owns, as in deploy.yml.
on:
  workflow_dispatch:

# Queue instead of running in parallel
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64 }
          - { os: windows, arch: x64 }
          - { os: linux, arch: x64 }
    runs-on: [ self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}" ]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Add msbuild to PATH
        if: runner.os == 'windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: "NuGet"
        if: runner.os == 'windows'
        env:
          NugetCredentials: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "NuGetPackageSourceCredentials_gh-ikvmnet=${{ env.NugetCredentials }}" >> $env:GITHUB_ENV
          echo "NuGetPackageSourceCredentials_gh-iterate-ch=${{ env.NugetCredentials }}" >> $env:GITHUB_ENV
      - name: Deploy with Maven
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          deploy -DskipTests -DskipITs -P"!local"
          --also-make --projects ${{ fromJSON('{"Linux":"i18n,profiles,cli/linux","Windows":"i18n,profiles,windows,cli/windows","macOS":"i18n,profiles,osx,cli/osx"}')[runner.os] }}
        env:
          MAVEN_CYBERDUCK_USERNAME: ${{ secrets.MAVEN_CYBERDUCK_USERNAME }}
          MAVEN_CYBERDUCK_PASSWORD: ${{ secrets.MAVEN_CYBERDUCK_PASSWORD }}
          SKIP_SIGN: true
          SKIP_NOTARIZE: true
