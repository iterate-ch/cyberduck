name: Import Developer ID Certificate
description: Imports the Developer ID certificate and intermediate CAs into a temporary keychain on macOS runners.

inputs:
  certificate:
    description: Base64-encoded Developer ID certificate (PKCS#12)
    required: true
  certificate-password:
    description: Password for the PKCS#12 certificate
    required: true

runs:
  using: composite
  steps:
    - name: Import Developer ID certificate
      if: runner.os == 'macos'
      shell: bash
      env:
        CERTIFICATE_BASE64: ${{ inputs.certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        printf '%s' "$CERTIFICATE_BASE64" | base64 -D > certificate.p12
        KEYCHAIN_PATH=${{ runner.temp }}/build.keychain-db
        KEYCHAIN_PASSWORD=$(uuidgen)
        /usr/bin/security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        # Explicit 6h lock timeout: a freshly created keychain otherwise falls back to the
        # default 300s inactivity lock and relocks mid-build, making codesign fail with
        # "no identity found".
        /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        curl -fsSL -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
        /usr/bin/security import AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
        curl -fsSL -o DeveloperIDCA.cer https://www.apple.com/certificateauthority/DeveloperIDCA.cer
        /usr/bin/security import DeveloperIDCA.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
        /usr/bin/security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/productsign
        /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        /usr/bin/security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        # Prepend our keychain to the user search list without dropping the keychains already there
        /usr/bin/security list-keychains -d user -s "$KEYCHAIN_PATH" $(/usr/bin/security list-keychains -d user | sed -e 's/"//g' -e 's/^[[:space:]]*//' | grep -v -F "$KEYCHAIN_PATH")
